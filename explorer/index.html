<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dyno Explorer</title>
<link rel="stylesheet" href="app.css" />
</head>
<body>
  <div id="app">
    <header id="toolbar">
      <span class="logo">Dyno<span class="logo-accent"> Explorer</span></span>

      <label class="field"><span class="field-label">Mode</span>
        <select id="mode-select">
          <option value="sv-builtin" selected>SystemVerilog · sky130 (built-in)</option>
          <option value="sv-no-abc">SystemVerilog · sky130 (no ABC)</option>
          <option value="sv-parsed">SystemVerilog · sky130 (parse liberty + memory)</option>
          <option value="ir-builtin">Dyno-IR · sky130 (built-in)</option>
          <option value="test">Dyno test</option>
        </select>
      </label>

      <div class="field extra-args" id="extra-args-field">
        <span class="field-label">Extra args</span>
        <input id="extra-args" class="extra-args" spellcheck="false"
               placeholder="--debug" />
      </div>

      <button id="run-btn" class="btn run">▶ Run</button>
      <span id="status" class="status"></span>
      <span class="spacer"></span>
      <button id="console-btn" class="btn subtle" title="Show/hide dyno stdout + stderr output">Console</button>
    </header>

    <div id="main">
      <div id="editor-area"></div>

      <div id="console-divider" class="splitter" title="Drag to resize console" style="display:none"></div>

      <div id="console" class="console" style="display:none">
        <div class="console-head">
          <span class="console-title">Console</span>
          <span class="spacer"></span>
          <button id="console-close" class="btn subtle" title="Close console">✕</button>
        </div>
        <div id="console-body" class="console-body"></div>
      </div>
    </div>

    <div id="errorbar" class="errorbar" style="display:none"></div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
